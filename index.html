<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"DM Mono";src:url(fonts/dm-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Mono";src:url(fonts/dm-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}
/* Layout: one page, three faces. The landing picks a face: the host's TV (16:9 screen plus a control bar), or a player's phone (one narrow column). Single deliberate dark plum look. */
:root{
  --felt:#2a1433; --felt-2:#47214f; --felt-3:#1c0c23; --bezel:#0f0612;
  --ink:#f7f1f6; --muted:#c6b0cb; --line:rgba(247,241,246,.14);
  --gold:#f4b73a; --gold-ink:#2e2100; --coral:#ff6b57; --mint:#7fe0b0;
  --paper:#fbfbf6; --paper-ink:#1a231f; --paper-muted:#7a857f;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--felt);color:var(--ink);min-height:100%}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(1200px 600px at 50% -10%, var(--felt-2), transparent 70%), var(--felt);min-height:100dvh}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--felt-3);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{padding:14px 20px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--mint);border-color:rgba(127,224,176,.4)}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--felt-3);color:var(--ink)}
.banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--coral);color:#fff;padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.banner[hidden]{display:none}

/* landing */
.land{max-width:520px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 48px;display:grid;gap:28px}
.brand h1{font-size:clamp(48px,14vw,84px);font-weight:800;letter-spacing:-.03em}
.brand h1 span{color:var(--gold)}
.brand p{margin:10px 0 0;color:var(--muted)}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--felt-3);color:var(--ink);border-radius:14px;padding:14px 10px;text-align:left}
.seg button b{display:block;font-family:var(--display);font-size:20px}
.seg button span{font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--gold)}

/* host */
.hostwrap{min-height:100dvh;display:grid;grid-template-rows:1fr auto;gap:12px;padding:12px max(12px,env(safe-area-inset-left,0px))}
.stagebox{display:grid;place-items:center;min-height:0}
.screen{container-type:inline-size;aspect-ratio:16/9;width:min(100%, calc((100dvh - 110px) * 16 / 9));border-radius:12px;overflow:hidden;position:relative;background:var(--felt-3);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
:fullscreen .screen{width:min(100vw, calc(100vh * 16 / 9));border-radius:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.bar .sp{flex:1}

/* TV contents, sized in container units so they scale with the screen */
.tv-lobby{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.25fr;gap:4cqw;padding:4.5cqw}
.tv-lobby h2{font-size:6.4cqw;font-weight:800;letter-spacing:-.03em}
.tv-lobby h2 span{color:var(--gold)}
.qr{width:16cqw;background:var(--paper);padding:1cqw;border-radius:1cqw;margin-top:2.2cqw}
.qr svg,.qr img{display:block;width:100%;height:auto}
.join{font-size:1.6cqw;color:var(--muted);margin-top:1.4cqw;max-width:34cqw}
.join b{color:var(--ink);font-family:var(--mono);font-size:1.6cqw;display:block;word-break:break-all;font-weight:500}
.join .code{font-size:5cqw;letter-spacing:.25em;color:var(--gold);margin:.4cqw 0 1cqw}
#rc{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:22px;text-align:center}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:2.5cqw;align-content:start}
.roster h3{font-size:1.8cqw;font-family:var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:1.2cqw}
.pl{display:flex;align-items:center;gap:1cqw;font-size:2cqw;padding:.9cqw 1.3cqw;border-radius:1cqw;background:rgba(255,255,255,.06);margin-bottom:.9cqw}
.pl.away{opacity:.45}
.pl .x{margin-left:auto;font-size:1.4cqw;color:var(--muted)}
.dot{width:1.4cqw;height:1.4cqw;border-radius:50%;flex:none}
.empty{font-size:1.7cqw;color:var(--muted);border:.2cqw dashed var(--line);border-radius:1cqw;padding:1.4cqw}
.hud{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:1cqw}
.hud .who{background:rgba(28,12,35,.88);color:var(--ink);font-size:1.7cqw;padding:.8cqw 1.6cqw;border-radius:99px}
.hud .clock{background:var(--gold);color:var(--gold-ink);font-family:var(--mono);font-size:2.6cqw;font-weight:500;padding:.6cqw 1.8cqw;border-radius:99px}
.clock.low{background:var(--coral);color:#fff}
.pips{display:flex;gap:.8cqw}
.pips i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:rgba(26,35,31,.25)}
.pips i.on{background:var(--paper-ink)}
.float{position:absolute;bottom:5cqw;font-size:4.5cqw;line-height:1;pointer-events:none;z-index:5;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-4cqw) scale(1)}100%{transform:translateY(-34cqw) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.float{animation-duration:1.4s}}
.qa{position:absolute;inset:0;background:rgba(28,12,35,.94);padding:4.5cqw;display:grid;grid-template-columns:1fr 1.6fr;gap:4cqw;align-items:start}
.qa h2{font-size:5cqw;font-weight:800}
.qa ol{list-style:none;margin:0;padding:0;display:grid;gap:1.2cqw}
.qa li{background:rgba(255,255,255,.07);border-radius:1.2cqw;padding:1.4cqw 1.8cqw;font-size:2.1cqw;line-height:1.3}
.qa li b{display:block;font-size:1.4cqw;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3cqw}
.qcount{position:absolute;top:2cqw;right:2cqw;background:rgba(28,12,35,.88);font-size:1.6cqw;padding:.6cqw 1.4cqw;border-radius:99px}

/* slides */
.slide{container-type:inline-size;position:absolute;inset:0;background:var(--paper);color:var(--paper-ink)}
.slide .in{position:absolute;inset:0;display:grid;place-items:center;align-content:center;padding:6cqw;text-align:center;gap:2cqw}
.slide .logo{width:17cqw;height:17cqw}
.slide .co{font-family:var(--display);font-weight:800;font-size:8cqw;letter-spacing:-.03em;line-height:1}
.slide .sub{font-size:2cqw;color:var(--paper-muted);letter-spacing:.14em;text-transform:uppercase}
.slide .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:4cqw;width:100%;align-items:end}
.slide .charts svg{width:100%;height:auto}
.slide .tagline{font-family:var(--display);font-weight:700;font-size:7cqw;line-height:1.05;max-width:22ch;letter-spacing:-.02em}
.slide .tagline::before{content:"\201C"} .slide .tagline::after{content:"\201D"}
.slide .corner{position:absolute;top:3cqw;left:3.5cqw;display:flex;align-items:center;gap:1.4cqw;font-weight:700;font-size:2cqw}
.slide .corner svg{width:4cqw;height:4cqw}

.tv-pad{position:absolute;inset:0;padding:4.5cqw;display:grid;gap:3cqw;align-content:start}
.tv-pad h2{font-size:4.6cqw;font-weight:800}
.lockgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw}
.lock{background:rgba(255,255,255,.06);border-radius:1cqw;padding:1.4cqw .6cqw;text-align:center;font-size:1.7cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock b{display:block;font-size:3cqw;margin-bottom:.4cqw}
.lock.ok{background:rgba(127,224,176,.14);color:var(--mint)}
.cos{display:flex;flex-wrap:wrap;gap:1.2cqw}
.cos span{display:flex;align-items:center;gap:1cqw;background:var(--paper);color:var(--paper-ink);border-radius:99px;padding:.6cqw 1.6cqw .6cqw .8cqw;font-weight:700;font-size:1.9cqw}
.cos svg{width:3cqw;height:3cqw}
.reveal-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:4cqw}
.bar-row{display:grid;grid-template-columns:3cqw 1fr;gap:1.2cqw;align-items:center;margin-bottom:1.6cqw}
.bar-row .rk{font-family:var(--display);font-weight:800;font-size:3.2cqw;color:var(--muted)}
.bar-row:first-child .rk{color:var(--gold)}
.bar-meta{display:flex;justify-content:space-between;font-size:1.8cqw;margin-bottom:.5cqw;gap:1cqw}
.bar-meta span{color:var(--muted)}
.track{height:2.6cqw;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--gold);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mult{font-family:var(--mono);font-size:1.6cqw;padding:.2cqw .9cqw;border-radius:99px;background:rgba(255,255,255,.1);color:var(--ink)}
.lb h3{font-size:1.8cqw;font-family:var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:1.2cqw}
.lb ol{list-style:none;margin:0;padding:0;display:grid;gap:.5cqw}
.lb li{display:flex;justify-content:space-between;gap:1cqw;font-size:1.7cqw;line-height:1.3;padding:.55cqw 1.2cqw;background:rgba(255,255,255,.06);border-radius:.8cqw}
.ftag{font-style:normal;font-size:1.2cqw;font-weight:700;color:var(--gold-ink);background:var(--gold);border-radius:.4cqw;padding:0 .5cqw;vertical-align:middle}
.up{color:var(--mint)} .down{color:var(--coral)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.tv-howto{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.3fr;gap:4cqw;padding:5cqw;align-items:center}
.tv-howto .art{font-size:16cqw;text-align:center;line-height:1}
.tv-howto .stepno{font-family:var(--mono);color:var(--gold);font-size:1.8cqw;letter-spacing:.12em;text-transform:uppercase}
.tv-howto h2{font-size:5.6cqw;font-weight:800;letter-spacing:-.02em;margin:1cqw 0 1.6cqw}
.tv-howto p{font-size:2.4cqw;color:var(--muted);margin:0;line-height:1.4}
.tpips{display:flex;gap:.8cqw;margin-top:3cqw}
.tpips i{width:3cqw;height:.7cqw;border-radius:99px;background:rgba(255,255,255,.18)}
.tpips i.on{background:var(--gold)}

/* phone */
.phone{max-width:480px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px;display:grid;gap:16px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptop .me{display:flex;align-items:center;gap:8px;font-weight:700}
.ptop .me .dot{width:12px;height:12px}
.phone h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.phone .bignum{font-family:var(--mono);font-size:44px;color:var(--gold)}
.mini{container-type:inline-size;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden}
.navs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navs .btn{font-size:28px;padding:10px}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emos button{font-size:28px;background:var(--felt-3);border:1px solid var(--line);border-radius:12px;padding:10px 0}
.emos button:active{transform:scale(.92)}
.ask{display:flex;gap:8px}
.ask input{flex:1}
.sent{font-size:13px;color:var(--mint);min-height:1.5em}
.alloc{display:grid;gap:14px}
.arow{display:grid;gap:6px}
.arow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.arow .top span{display:flex;align-items:center;gap:8px}
.arow svg{width:24px;height:24px}
.arow input[type=range]{width:100%;accent-color:var(--gold)}
.arow .cap{font-size:12px;color:var(--muted)}
.left{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
.rule{font-size:13px;color:var(--muted)}
.res{display:grid;gap:8px}
.res .r{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:rgba(255,255,255,.06);border-radius:10px;font-size:15px}
.tip{border-left:3px solid var(--gold);padding:6px 12px;color:var(--ink);background:rgba(244,183,58,.08);border-radius:0 10px 10px 0}
</style>

<div class="banner" id="banner" hidden></div>
<div id="app"></div>

<script src="app.js"></script>
